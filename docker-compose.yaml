services:
  ollama-app:
    image: poswark/ollama-gemma2:0.0.1
    container_name: ollama-app
    env_file:
      - .env
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
    mem_limit: 10g
    memswap_limit: 12g

    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - ollama-app
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data: